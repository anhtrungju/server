SummonPiglets:
  Cooldown: 150
  Skills:
  - effect:sound{s=entity.hoglin.ambient;p=1;v=1.5} @self # Âm thanh Hoglin
  - effect:particles{p=FLAME;amount=10;hS=0.5;vS=0.5;y=0.1;speed=0.1} @self # Hạt lửa
  - summon{m=NetherPiglet;a=3;y=0.5;spread=2} @self # Triệu hồi 3 NetherPiglet quanh boss
# plugins/MythicMobs/Skills/GiveRandomItems.yml
# plugins/MythicMobs/Skills/GiveRandomItems.yml
GiveRandomItems:
  Cooldown: 60 # Để tránh lặp lại quá nhanh nếu boss nhận nhiều sát thương liên tục
  Skills:
  - effect:sound{s=entity.player.levelup;p=1;v=1} @self # Âm thanh thăng cấp
  - particles{p=HAPPY_VILLAGER;amount=20;hS=0.5;vS=0.5} @self # Hạt cảm xúc

  # --- Các vật phẩm sẽ được ném ra ---
  # Sử dụng 'dropitem' để ném vật phẩm ra đất.
  # '@PlayersInRadius{r=10}' sẽ ném gần người chơi trong bán kính 10 ô của boss.
  # Bạn cũng có thể dùng '@self' để ném ngay dưới chân boss.

  - dropitem{item=diamond;amount=1-3;chance=20} @PlayersInRadius{r=10} # 20% ném 1-3 kim cương
  - dropitem{item=golden_apple;amount=1;chance=10} @PlayersInRadius{r=10} # 10% ném 1 táo vàng
  - dropitem{item=iron_sword;amount=1;chance=15} @PlayersInRadius{r=10} # 15% ném 1 kiếm sắt

  # Ví dụ thêm một số vật phẩm khác:
  - dropitem{item=emerald;amount=5;chance=50} @PlayersInRadius{r=10} # 50% ném 5 ngọc lục bảo
  - dropitem{item=blaze_rod;amount=1;chance=5} @PlayersInRadius{r=10} # 5% ném 1 gậy lửa